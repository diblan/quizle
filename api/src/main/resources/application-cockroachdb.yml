spring:
  datasource:
    url: ${COCKROACHDB_URL}
    username: ${COCKROACHDB_USER}
    password: ${COCKROACHDB_PASSWORD}
    driver-class-name: org.postgresql.Driver # optional
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/cockroachdb

logging:
  level:
    org.flywaydb.core: DEBUG
